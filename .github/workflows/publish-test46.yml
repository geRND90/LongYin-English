name: Publish TEST46 data-only release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-test46.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Bootstrap TEST46 publisher'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.8-test46-data
      RELEASE_NAME: LongYin English v0.1.8-test46-data
      SOURCE_ASSET: TEST46_SOURCE_UPDATE.zip
      FINAL_ASSET: LongYinEnglish_v0.1.8_TEST46_AUTHORIZED_CORPUS_DATA_WAVE.zip
      SOURCE_SHA256: d113844881ac764be4c4610708ec6a893e5a7c21ef1d705f9d2ffb49692e1bee
      FINAL_SHA256: 62902fbf02912d1b695941260e4d504f699197ed2dcfde36903c705d076dcd89
      FINAL_SIZE: "7046921"

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate draft and assets
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "v0.1.8-test46-data" and .draft == true) | .id' | head -n 1)"
          test -n "$release_id"
          source_asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --jq '.[] | select(.name == "TEST46_SOURCE_UPDATE.zip") | .id' | head -n 1)"
          final_asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --jq '.[] | select(.name == "LongYinEnglish_v0.1.8_TEST46_AUTHORIZED_CORPUS_DATA_WAVE.zip") | .id' | head -n 1)"
          test -n "$source_asset_id"
          test -n "$final_asset_id"
          {
            echo "release_id=$release_id"
            echo "source_asset_id=$source_asset_id"
            echo "final_asset_id=$final_asset_id"
          } >> "$GITHUB_OUTPUT"

      - name: Download and verify assets
        shell: bash
        run: |
          set -euo pipefail
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/${{ steps.release.outputs.source_asset_id }}" > "$RUNNER_TEMP/$SOURCE_ASSET"
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/${{ steps.release.outputs.final_asset_id }}" > "$RUNNER_TEMP/$FINAL_ASSET"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/$SOURCE_ASSET" | sha256sum --check -
          echo "$FINAL_SHA256  $RUNNER_TEMP/$FINAL_ASSET" | sha256sum --check -
          test "$(stat -c%s "$RUNNER_TEMP/$FINAL_ASSET")" = "$FINAL_SIZE"
          unzip -t "$RUNNER_TEMP/$SOURCE_ASSET"
          unzip -t "$RUNNER_TEMP/$FINAL_ASSET"

      - name: Apply TEST46 source update
        shell: bash
        run: |
          set -euo pipefail
          if unzip -Z1 "$RUNNER_TEMP/$SOURCE_ASSET" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe path in source archive" >&2
            exit 1
          fi
          unzip -q -o "$RUNNER_TEMP/$SOURCE_ASSET" -d "$GITHUB_WORKSPACE"
          python3 tools/audit_test46.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("docs/TEST46_AUDIT.json").read_text(encoding="utf-8"))
          if report.get("status") != "PASS" or report.get("failures"):
              raise SystemExit(f"TEST46 audit failed: {report.get('failures')}")
          print("TEST46 audit PASS")
          PY

      - name: Commit audited data to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-test46.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add TEST46 authorized corpus data wave"
          git push origin HEAD:main
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Finalize prerelease
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/${{ steps.release.outputs.source_asset_id }}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" -f sha="$target_sha" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$target_sha" >/dev/null
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/${{ steps.release.outputs.release_id }}" \
            -f name="$RELEASE_NAME" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$target_sha" \
            -F draft=false \
            -F prerelease=true \
            -f make_latest=false >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/${{ steps.release.outputs.release_id }}" \
            --jq '{tag_name, draft, prerelease, html_url, assets: [.assets[].name]}'
