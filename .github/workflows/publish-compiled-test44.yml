name: Publish compiled TEST44

on:
  push:
    paths:
      - ".github/workflows/publish-compiled-test44.yml"
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-compiled-test44
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || github.event.issue.title == '[release] publish compiled TEST44'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.1.8-test44
      ASSET: LongYinEnglish_v0.1.8_TEST44_COMPILED_NUMERIC_LAYERS_212_CANONICAL_WAVE.zip
      BASE_ASSET: LongYinEnglish_v0.1.8_TEST44_NUMERIC_LAYERS_212_CANONICAL_DATA_WAVE.zip
      DLL_BLOB: 6704cdf649ca4d8658741e91b9d6f5bbeb55d050

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify committed TEST44 source and data
        shell: bash
        run: |
          set -euo pipefail
          grep -F '0.1.8-test44' LongYinEnglish/MainMod.cs
          grep -F 'else if (s=="长") result="Polearm";' LongYinEnglish/MainMod.cs
          sha256sum -c <<'HASHES'
          59f40567e784c9bd3e969b5bc8bbab3b806e40261fa1df0ef84f61d2e2eb96fe  UserData/LongYinEnglish/aliases.tsv
          4fa84c98a3ccda69f2f7a3c3624c850cc4523ecd9337c29b2a75bbbefe1ca3fe  UserData/LongYinEnglish/building_names.tsv
          cca398c4a5a1a58814c4dd405e69f2d69bb399101e21a7083f5dbabafd46ae71  UserData/LongYinEnglish/canonical.tsv
          86f6b57cc8996656b7740df7a09def8ea81bdb82d126f4f1023abc7dc64f9b05  UserData/LongYinEnglish/fallback_exact.tsv
          6c2226612d94bc1339d88ba6ebaf29b54aec0920fb4cd883423e64be7220bbc9  UserData/LongYinEnglish/npc_given_chars.tsv
          203e7cb709aa7bd1d5abb7239a6ac380a9fc33709f515274e9d741483b2a78a5  UserData/LongYinEnglish/npc_names.tsv
          240d58f45da1632bbd93276b5d9c46b9617c321699140832b2f91f2708a77c9e  UserData/LongYinEnglish/npc_surnames.tsv
          1fa3f8345ba2868eb0436dbff8b30659cd8d5f82077e32574a817ca7f06aea10  UserData/LongYinEnglish/regex.tsv
          8c182a099d98db8d6f7ef3aa810bacd66649501031cc76b523f5c552e654d876  UserData/LongYinEnglish/tokens.tsv
          HASHES

      - name: Assemble reproducible compiled package
        shell: bash
        run: |
          set -euo pipefail
          export TZ=UTC
          base_dir="$(mktemp -d)"
          package_dir="$(mktemp -d)"
          gh release download v0.1.8-test44-data --pattern "$BASE_ASSET" --dir "$base_dir"
          unzip -q "$base_dir/$BASE_ASSET" -d "$package_dir"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$DLL_BLOB" --jq .content |
            tr -d '\n' | base64 --decode > "$package_dir/Mods/LongYinEnglish.dll"
          echo "f82d025fd2fdf80faaf29479daffe14c3d17f357e4f1fb39ddc2360cecb11834  $package_dir/Mods/LongYinEnglish.dll" | sha256sum -c -
          cp UserData/LongYinEnglish/*.tsv "$package_dir/UserData/LongYinEnglish/"
          echo "994dbeafb160ddc269e046a9496ca20c1bc7ff2886ce7a736cbc30403e666053  $package_dir/Mods/ModsOfLong/modLongYinEnglish/Info.json" | sha256sum -c -
          echo "4ae5072fe1f69b786b2d723c56e1e521a51a0e38fb5893181cbc18c440bb5054  $package_dir/Mods/ModsOfLong/modLongYinEnglish/Data/PlotData.csv" | sha256sum -c -
          find "$package_dir/Mods" "$package_dir/UserData" -type f -exec chmod 0644 {} +
          find "$package_dir/Mods" "$package_dir/UserData" -type f -exec touch -t 200001010000 {} +
          (
            cd "$package_dir"
            LC_ALL=C find Mods UserData -type f -print |
              LC_ALL=C sort |
              zip -q -X -9 "$RUNNER_TEMP/$ASSET" -@
          )
          unzip -t "$RUNNER_TEMP/$ASSET" >/dev/null
          test "$(unzip -Z1 "$RUNNER_TEMP/$ASSET" | wc -l)" -eq 12
          test "$(unzip -Z1 "$RUNNER_TEMP/$ASSET" | grep -ci '\.dll$')" -eq 1
          ! unzip -Z1 "$RUNNER_TEMP/$ASSET" | grep -Eqi '(^|/)(Refs?|MelonLoader|0Harmony)(/|$)|\.pdb$'
          sha256sum "$RUNNER_TEMP/$ASSET"

      - name: Publish compiled TEST44 prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$TAG" "$RUNNER_TEMP/$ASSET" \
            --target main \
            --title "LongYin English v0.1.8-test44" \
            --prerelease \
            --notes-file - <<'NOTES'
          Compiled TEST44 release.

          - Includes the compiled path-guarded Research HUD mapping for the standalone `长` abbreviation: `Polearm`.
          - Fixes `Already learned Chapter 一 Repeat` to the canonical `Already learned at Layer 1` format.
          - Keeps context-safe numeric normalization for Layer, Chapter, Rank, Round, item, auction, and Level labels.
          - Includes the complete Latest 212 canonical translation wave.
          - Contains no Refs folder, MelonLoader, Harmony, PDB, or compiler output.

          The earlier `v0.1.8-test44-data` release remains available for history. See `docs/TEST44_COMPILED_AUDIT.txt` for hashes and verification details.
          NOTES

      - name: Remove temporary publisher workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-compiled-test44.yml
          git commit -m "Remove compiled TEST44 publisher workflow"
          git push origin HEAD:main

      - name: Close trigger issue
        if: github.event_name == 'issues'
        shell: bash
        run: gh issue close "${{ github.event.issue.number }}" --comment "Compiled TEST44 was published successfully."
